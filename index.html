<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar certificados | Kendry Contreras</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <div class="icon-header">
        <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <h1>Verificar Certificado</h1>
    <p>Ingresa el código único para validar la autenticidad del certificado emitido.</p>

    <div class="input-group">
        <i class="fa-solid fa-qrcode"></i>
        <input type="text" id="certId" placeholder="Ej: EXCEL-123456" spellcheck="false">
    </div>

    <button onclick="validarCertificado()" id="btnConsultar">Consultar</button>

    <div id="resultado">
    </div>

    <footer>
        &copy; 2026 Verificación de certificados</br>Emitidos por Kendry Contreras [Ing. Informática]
    </footer>
</div>
<script>
  // 1. Capturamos la URL actual
  const urlParams = new URLSearchParams(window.location.search);
  
  // 2. Buscamos el parámetro llamado 'codigo'
  const elCodigo = urlParams.get('id');

  // 3. Si el código existe en la URL, lo pegamos en el input
  if (elCodigo) {
    document.getElementById('certId').value = elCodigo;
  }
</script>
<script src="script.js"></script>

</body>

</html>
